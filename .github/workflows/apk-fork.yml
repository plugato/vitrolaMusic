# APK do fork (Android Auto). Roda a cada push no branch feat/android-auto ou na main, e
# manualmente pela aba Actions. Com os secrets de assinatura configurados, gera o APK de
# release assinado; sem eles, gera um APK de debug (assinado com uma chave temporária do
# runner: cada build novo precisa desinstalar o anterior). O APK fica nos artefatos do run.
name: APK (fork)

on:
  push:
    branches: [feat/android-auto, main]
    paths: ['mobile/**', 'frontend/src/**', 'api/src/**', '.github/**']
  workflow_dispatch:

concurrency:
  group: apk-fork-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      HAS_KEY: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v5

      - name: APK assinado (secrets configurados)
        if: env.HAS_KEY == 'true'
        id: release
        uses: ./.github/actions/build-apk
        with:
          keystore-base64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          keystore-password: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          key-alias: ${{ secrets.ANDROID_KEY_ALIAS }}
          key-password: ${{ secrets.ANDROID_KEY_PASSWORD }}

      - uses: actions/setup-node@v5
        if: env.HAS_KEY != 'true'
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - uses: actions/setup-java@v5
        if: env.HAS_KEY != 'true'
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: APK de debug (sem secrets)
        if: env.HAS_KEY != 'true'
        shell: bash
        run: |
          npm ci --prefix mobile
          npm run typecheck --prefix mobile
          npm test --prefix mobile
          cd mobile
          npx vite build
          npx cap sync android
          cd android
          java -classpath gradle/wrapper/gradle-wrapper.jar org.gradle.wrapper.GradleWrapperMain \
            assembleDebug --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: vitrola-android-auto-${{ github.sha }}
          path: |
            mobile/android/app/build/outputs/apk/release/app-release.apk
            mobile/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      # Link fácil para baixar pelo celular: Releases → "Android Auto (teste)".
      - name: Publicar o APK na release "android-auto"
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          apk=""
          for f in mobile/android/app/build/outputs/apk/release/app-release.apk mobile/android/app/build/outputs/apk/debug/app-debug.apk; do
            if [ -f "$f" ]; then apk="$f"; break; fi
          done
          cp "$apk" vitrola-android-auto.apk
          gh release delete android-auto --yes --cleanup-tag 2>/dev/null || true
          gh release create android-auto vitrola-android-auto.apk \
            --target "$GITHUB_SHA" --prerelease \
            --title "Android Auto (teste)" \
            --notes "APK gerado do commit ${GITHUB_SHA::7} (branch ${GITHUB_REF_NAME}). Baixe o arquivo vitrola-android-auto.apk abaixo."
